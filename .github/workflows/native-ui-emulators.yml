name: Android Native UI Smoke (phone and tablet emulator)

on:
  push:
    paths:
      - 'native-android/app/src/**'
      - 'native-android/app/build.gradle.kts'
      - '.github/workflows/native-ui-emulators.yml'
      - 'native-android/tools/run_ui_smoke.sh'
  workflow_dispatch:

concurrency:
  group: shiguang-native-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  devices:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            profile: pixel_6
          - name: tablet
            profile: pixel_c
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK 35 and emulator
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # The emulator runner tests whether /dev/kvm is read/write accessible.
      # Without this it silently falls back to -accel off, which emulator 37
      # rejects before the AVD can even finish booting.
      - name: Enable KVM for hardware-accelerated emulator
        shell: bash
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::GitHub runner does not expose /dev/kvm; cannot run x86_64 Android instrumentation here"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          emulator -accel-check
      - name: Run Compose UI tests and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 35 image stalled in system Settings/Phone before any UI assertion.
          # Use Android 34 for stable baseline smoke, retain compileSdk/targetSdk 35.
          api-level: 34
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -memory 2048
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash native-android/tools/run_ui_smoke.sh ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-${{ matrix.name }}-emulator-report
          path: |
            native-android/app/build/outputs/androidTest-results/
            native-${{ matrix.name }}-home.png
            native-${{ matrix.name }}-logcat.txt
            native-${{ matrix.name }}-diagnostics.txt
          if-no-files-found: ignore
