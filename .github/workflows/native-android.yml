name: Native Android (On-Demand Content)
on:
  push:
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android.yml'
  pull_request:
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:

concurrency:
  group: shiguang-native-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check offline MP3 duration and timeline verification logic
        working-directory: native-android
        run: python3 -m unittest discover -s tools/tests -p 'test_audio_verification.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify small install APK does not bundle the full resource archive
        working-directory: native-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assets = Path("app/src/main/assets")
          media = list(assets.rglob("*.mp3")) + list(assets.rglob("*.wav"))
          packed_vocab = assets/"vocabulary"/"university-words.json"
          assert not media, "Unexpected bundled audio in on-demand build"
          assert not packed_vocab.exists(), "Unexpected full word corpus in on-demand build"
          assert (assets/"university"/"catalog.json").exists()
          print("ON_DEMAND_SMALL_APK verified; catalog only")
          PY
      - name: Unit tests and native debug build (retry dependency rate limits)
        working-directory: native-android
        timeout-minutes: 25
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt / 3"
            if gradle --no-daemon --max-workers=2 --no-parallel :app:testDebugUnitTest :app:assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 55))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: shiguang-native-on-demand-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
